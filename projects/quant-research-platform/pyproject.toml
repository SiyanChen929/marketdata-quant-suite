[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Point-in-time, execution-aware quantitative research platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=0.10",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0,<3.0",
  "plotly>=5.18",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "quant-marketdata>=0.1,<0.2",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
dashboard = ["streamlit>=1.30"]

[project.scripts]
quant-platform = "quant_system.cli:main"
quant-system = "quant_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
