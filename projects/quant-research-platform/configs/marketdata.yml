data_provider: "marketdata"
data_path: "${QUANT_DATA_HOME}/lake/confirmed"
intraday_data_path: "${QUANT_DATA_HOME}/staging/provisional"
fundamentals_path: "data/sample/fundamentals.csv"
events_path: "data/sample/events.csv"
output_dir: "runs"
start_date: "2020-01-01"
end_date: null
timeframe: "1d"

universe:
  mode: "custom_watchlist"
  base: "custom_watchlist"
  include_etfs: true
  custom_only: true
  custom_symbols: ["QQQ", "SPY", "DY", "ECG", "EME", "FIX", "GVA", "J", "MTZ", "MYRG", "PRIM", "PWR", "ROAD", "STRL", "WLDN", "AR", "EQT", "ET", "FLNG", "GLNG", "KMI", "LNG", "OKE", "RRC", "VG", "AI", "AMZN", "DDOG", "ESTC", "GFS", "GOOGL", "IONQ", "MDB", "META", "MSFT", "NET", "NOW", "NTAP", "NTNX", "PDFS", "PL", "PLTR", "PSTG", "QBTS", "RGTI", "RMBS", "SIMO", "SNDK", "SNOW", "STX", "WDC", "ARRY", "BE", "ENPH", "FLNC", "FSLR", "ITRI", "NXT", "RUN", "SEDG", "SEI", "STEM", "AAON", "CARR", "JCI", "LII", "MOD", "TT", "ACLS", "ACMR", "ADI", "AEHR", "ALGM", "AMAT", "AMBA", "AMD", "ANET", "AVGO", "CEVA", "COHU", "CRUS", "DELL", "DIOD", "HPE", "ICHR", "INTC", "KLAC", "LRCX", "LSCC", "MCHP", "MPWR", "MRVL", "MTSI", "MU", "NVDA", "NXPI", "ON", "ORCL", "PLAB", "POWI", "QCOM", "SMCI", "SYNA", "TER", "TXN", "UCTT", "VECO", "WOLF", "AEP", "BWXT", "CMS", "CNP", "D", "DTE", "DUK", "EIX", "ETR", "EXC", "FE", "LEU", "LTBR", "NEE", "NNE", "NRG", "OKLO", "PCG", "PEG", "PPL", "SMR", "SO", "SRE", "TLN", "VST", "WEC", "XEL", "AAOI", "APLD", "BTBT", "CIEN", "CIFR", "COHR", "COMM", "CORZ", "CRDO", "CSCO", "EXTR", "FN", "GLW", "HUT", "IBM", "IREN", "KEYS", "LITE", "NBIS", "VIAV", "AMSC", "ATKR", "AYI", "ETN", "GEV", "GNRC", "GWW", "HUBB", "NVT", "POWL", "RRX", "VRT", "WCC", "WMB", "CQP", "CTRA", "ARM", "AES", "CEG", "GTLS", "IESC", "ASML", "HIMX", "TSM", "CCJ", "UUUU", "JNPR"]
  benchmark: "SPY"
  min_price: 5
  min_avg_dollar_volume_20d: 20000000
  min_avg_volume_20d: 500000
  min_history_days: 252
  allow_speculative_bucket: false

fundamentals:
  enabled: true
  provider: "marketdata"

events:
  enabled: true
  provider: "marketdata"

execution:
  signal_timing: "close_to_next_open"
  fill_price: "open"
  slippage_bps: 5
  commission_per_share: 0.005
  short_borrow_fee_annual: 0.03
  min_trade_notional: 250
  max_adv_participation: 0.05
  market_impact_bps_per_1pct_adv: 1.0
  daily_turnover_cap: 0.20

portfolio:
  initial_capital: 100000
  construction: "score_weighted"
  max_position_weight: 0.10
  target_gross_exposure: 1.0
  target_net_exposure: 0.5
  volatility_target: 0.25
  rebalance: "daily_throttled"
  throttle_min_weight_change: 0.03
  throttle_min_score_change: 10.0
  throttle_min_new_weight: 0.01
  max_total_positions: 40
  min_target_weight: 0.01

risk:
  max_drawdown_reduce_exposure: 0.12
  max_drawdown_cash_mode: 0.20
  drawdown_reduction_multiplier: 0.5
  atr_stop_multiple: 2.5
  trailing_stop_atr_multiple: 3.0
  drawdown_reset: "yearly"
  min_holding_days: 3

strategies:
  momentum:
    enabled: true
    weight: 0.50
    lookback_returns: 63
    skip_recent_days: 5
    long_quantile: 0.25
    short_quantile: 0.25
    max_positions: 20
  breakout:
    enabled: true
    weight: 0.30
    breakout_window: 55
    retest_ma: 20
    volume_multiplier: 1.3
    max_holding_days: 60
  trend:
    enabled: true
    weight: 0.20
    ma_fast: 50
    ma_slow: 200
  mean_reversion:
    enabled: false
    weight: 0.0
